# SSS Furniture shop: Nginx site. Lives next to the CRM's sites without touching them.
#   shop.sssfurniture.co.in       storefront (Next.js 127.0.0.1:3100) + API (/api → 127.0.0.1:4100)
#   shopadmin.sssfurniture.co.in  admin      (Next.js 127.0.0.1:3101) + API
# The bare domain stays on Wix; admin. and api. stay with the CRM.
#
# Install (see deploy/README.md step 7):
#   cp /opt/sss-shop/backend/deploy/nginx/sss-shop.conf /etc/nginx/sites-available/sss-shop.conf
#   ln -s /etc/nginx/sites-available/sss-shop.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d shop.sssfurniture.co.in -d shopadmin.sssfurniture.co.in
# Using different names? Replace both names everywhere in this file (and in the .env files).

# --- First rate-limit layer (the API adds its own per-route limits) ---------
limit_req_zone  $binary_remote_addr zone=shop_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=shop_media:10m rate=50r/s;
limit_req_zone  $binary_remote_addr zone=shop_pages:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=shop_conn:10m;

upstream shop_api        { server 127.0.0.1:4100; keepalive 16; }
upstream shop_storefront { server 127.0.0.1:3100; keepalive 16; }
upstream shop_admin      { server 127.0.0.1:3101; keepalive 8; }

# --- Storefront: shop.sssfurniture.co.in ------------------------------------
# Certbot adds the "listen 443 ssl" lines, the certificate paths and the http→https redirect.
server {
    listen 80;
    listen [::]:80;
    server_name shop.sssfurniture.co.in;

    server_tokens off;
    client_max_body_size 10m;          # review and return photos are 8 MB at most
    limit_conn shop_conn 60;
    limit_req_status 429;
    limit_conn_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json;

    # Every proxied request gets the visitor's real IP. X-Forwarded-For is
    # overwritten (not appended), so a visitor cannot fake their IP to dodge limits.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Razorpay webhooks: never rate-limited (the signature is checked instead).
    location /api/webhooks/ {
        proxy_pass http://shop_api/v1/webhooks/;
    }

    location /api/ {
        limit_req zone=shop_api burst=40 nodelay;
        proxy_pass http://shop_api/v1/;
    }

    # Original uploads straight from disk (Next's image optimiser serves the resized copies).
    location /media/ {
        limit_req zone=shop_media burst=100 nodelay;
        alias /opt/sss-shop/backend/storage/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://shop_storefront;
        access_log off;
    }

    location /_next/image {
        limit_req zone=shop_media burst=100 nodelay;
        proxy_pass http://shop_storefront;
        access_log off;
    }

    location / {
        limit_req zone=shop_pages burst=80 nodelay;
        proxy_pass http://shop_storefront;
    }
}

# --- Admin: shopadmin.sssfurniture.co.in ------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name shopadmin.sssfurniture.co.in;

    server_tokens off;
    client_max_body_size 110m;         # videos are 100 MB at most
    limit_conn shop_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    # Optional: allow only your office or home IPs.
    # allow 203.0.113.10;
    # deny all;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        limit_req zone=shop_api burst=40 nodelay;
        proxy_pass http://shop_api/v1/;
        proxy_request_buffering off;    # stream large uploads to the API
        proxy_read_timeout 120s;
    }

    location /media/ {
        alias /opt/sss-shop/backend/storage/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Private files (invoices, return photos). Reachable only through the API,
    # which checks the staff permission, writes the audit log, then hands off here.
    location /_private/ {
        internal;
        alias /opt/sss-shop/backend/storage/private/;
        add_header Cache-Control "private, no-store";
    }

    location / {
        proxy_pass http://shop_admin;
    }
}
