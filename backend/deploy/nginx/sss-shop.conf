# SSS Furniture shop: Nginx sites for both copies on this VPS (189.72.149.180).
#   Live (branch prod)  sssfurniture.co.in        → storefront 127.0.0.1:3100, API /api → 127.0.0.1:4100
#                       shopadmin.sssfurniture.co.in → admin 127.0.0.1:3101
#   Test (branch dev)   dev.sssfurniture.co.in    → storefront 127.0.0.1:3200, API /api → 127.0.0.1:4200
#                       devadmin.sssfurniture.co.in  → admin 127.0.0.1:3201
# admin. and api.sssfurniture.co.in belong to the CRM on another server.
# Certbot adds HTTPS to each block once its DNS points here:
#   certbot --nginx -d sssfurniture.co.in -d www.sssfurniture.co.in -d shopadmin.sssfurniture.co.in -d dev.sssfurniture.co.in -d devadmin.sssfurniture.co.in

limit_req_zone  $binary_remote_addr zone=shop_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=shop_media:10m rate=50r/s;
limit_req_zone  $binary_remote_addr zone=shop_pages:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=shop_conn:10m;
limit_req_status  429;
limit_conn_status 429;

upstream prod_api        { server 127.0.0.1:4100; keepalive 16; }
upstream prod_storefront { server 127.0.0.1:3100; keepalive 16; }
upstream prod_admin      { server 127.0.0.1:3101; keepalive 8; }
upstream dev_api         { server 127.0.0.1:4200; keepalive 8; }
upstream dev_storefront  { server 127.0.0.1:3200; keepalive 8; }
upstream dev_admin       { server 127.0.0.1:3201; keepalive 4; }

# Every proxied request carries the visitor's real IP. X-Forwarded-For is overwritten
# (not appended), so a visitor cannot fake their IP to dodge the API's rate limits.
proxy_http_version 1.1;
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
server_tokens off;
gzip_types text/css application/javascript application/json image/svg+xml model/gltf+json;

# ===================== LIVE (prod) =====================

server {
    listen 80;
    listen [::]:80;
    server_name www.sssfurniture.co.in;
    return 301 https://sssfurniture.co.in$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name sssfurniture.co.in;
    client_max_body_size 10m;          # review and return photos are 8 MB at most
    limit_conn shop_conn 60;

    location /api/webhooks/ { proxy_pass http://prod_api/v1/webhooks/; }   # never rate-limited: signature-checked
    location /api/ {
        limit_req zone=shop_api burst=40 nodelay;
        proxy_pass http://prod_api/v1/;
    }
    location /media/ {
        limit_req zone=shop_media burst=100 nodelay;
        alias /opt/sss-shop/prod/backend/storage/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }
    location /_next/static/ { proxy_pass http://prod_storefront; access_log off; }
    location /_next/image {
        limit_req zone=shop_media burst=100 nodelay;
        proxy_pass http://prod_storefront;
        access_log off;
    }
    location / {
        limit_req zone=shop_pages burst=80 nodelay;
        proxy_pass http://prod_storefront;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name shopadmin.sssfurniture.co.in;
    client_max_body_size 110m;         # videos are 100 MB at most
    limit_conn shop_conn 40;

    location /api/ {
        limit_req zone=shop_api burst=40 nodelay;
        proxy_pass http://prod_api/v1/;
        proxy_request_buffering off;    # stream large uploads to the API
        proxy_read_timeout 120s;
    }
    location /media/ {
        alias /opt/sss-shop/prod/backend/storage/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }
    # Private files (invoices, return photos): only through the API, which checks permission and logs it.
    location /_private/ {
        internal;
        alias /opt/sss-shop/prod/backend/storage/private/;
        add_header Cache-Control "private, no-store";
    }
    location / { proxy_pass http://prod_admin; }
}

# ===================== TEST (dev) =====================
# Same layout as live. Search engines are told to stay away.

server {
    listen 80;
    listen [::]:80;
    server_name dev.sssfurniture.co.in;
    client_max_body_size 10m;
    limit_conn shop_conn 60;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/webhooks/ { proxy_pass http://dev_api/v1/webhooks/; }
    location /api/ {
        limit_req zone=shop_api burst=40 nodelay;
        proxy_pass http://dev_api/v1/;
    }
    location /media/ {
        limit_req zone=shop_media burst=100 nodelay;
        alias /opt/sss-shop/dev/backend/storage/public/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        access_log off;
    }
    location /_next/static/ { proxy_pass http://dev_storefront; access_log off; }
    location /_next/image {
        limit_req zone=shop_media burst=100 nodelay;
        proxy_pass http://dev_storefront;
        access_log off;
    }
    location / {
        limit_req zone=shop_pages burst=80 nodelay;
        proxy_pass http://dev_storefront;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name devadmin.sssfurniture.co.in;
    client_max_body_size 110m;
    limit_conn shop_conn 40;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        limit_req zone=shop_api burst=40 nodelay;
        proxy_pass http://dev_api/v1/;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
    location /media/ {
        alias /opt/sss-shop/dev/backend/storage/public/;
        access_log off;
    }
    location /_private/ {
        internal;
        alias /opt/sss-shop/dev/backend/storage/private/;
        add_header Cache-Control "private, no-store";
    }
    location / { proxy_pass http://dev_admin; }
}
